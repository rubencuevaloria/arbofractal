<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arbofractal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-black min-h-screen text-white overflow-hidden">
    <!-- Fondo con efecto de grid -->
    <div class="fixed inset-0 bg-gradient-to-br from-purple-950/20 via-black to-cyan-950/20 pointer-events-none"></div>
    <div class="fixed inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 30px 30px;"></div>

    <div class="relative z-10 h-screen flex flex-col">
        <!-- Header minimalista flotante -->
        <div class="absolute top-8 left-1/2 -translate-x-1/2 z-50">
            <div class="backdrop-blur-xl bg-white/5 border border-white/10 rounded-full px-8 py-3 shadow-2xl">
                <h1 class="text-2xl font-extralight tracking-[0.3em] text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-400 to-cyan-400">
                    ARBOFRACTAL
                </h1>
            </div>
        </div>

        <!-- Contenedor principal -->
        <div class="flex-1 flex items-center justify-center p-4 pt-24">
            <div class="w-full max-w-[95vw] h-[80vh] flex gap-6">
                
                <!-- Canvas principal con marco futurista -->
                <div class="flex-1 relative group">
                    <div class="absolute inset-0 bg-gradient-to-br from-purple-500/20 via-transparent to-cyan-500/20 rounded-3xl blur-2xl opacity-50 group-hover:opacity-70 transition-opacity duration-500"></div>
                    <div class="relative h-full backdrop-blur-sm bg-white/5 border border-white/10 rounded-3xl overflow-hidden shadow-2xl">
                        <canvas id="canvas" class="w-full h-full"></canvas>
                        
                        <!-- Info flotante en canvas -->
                        <div class="absolute top-4 left-4 backdrop-blur-xl bg-black/40 border border-white/10 rounded-2xl px-4 py-2 font-mono text-xs space-y-1">
                            <div class="text-purple-300">L(n) = L₀ × r<sup>n</sup></div>
                            <div class="text-cyan-300">Ramas: <span id="branchCount">-</span> / <span id="totalBranchCount">-</span></div>
                        </div>

                        <!-- Estado animación flotante -->
                        <div id="animIndicator" class="absolute top-4 right-4 backdrop-blur-xl bg-black/40 border border-white/10 rounded-full px-4 py-2 font-mono text-xs hidden">
                            <div class="flex items-center gap-2">
                                <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                                <span class="text-emerald-300">ANIMANDO</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Panel de controles lateral con scroll -->
                <div class="w-80 h-full overflow-y-auto custom-scrollbar">
                    <div class="space-y-4 pb-8">
                        
                        <!-- Presets como cards -->
                        <div class="backdrop-blur-xl bg-white/5 border border-white/10 rounded-2xl p-4">
                            <h3 class="text-xs uppercase tracking-widest text-purple-300 mb-3 font-semibold">Presets</h3>
                            <div class="grid grid-cols-2 gap-2">
                                <button class="preset-btn group relative overflow-hidden bg-gradient-to-br from-purple-500/10 to-pink-500/10 hover:from-purple-500/20 hover:to-pink-500/20 border border-purple-500/30 rounded-xl p-3 text-xs transition-all duration-300 hover:scale-105" data-preset="classic">
                                    <div class="absolute inset-0 bg-gradient-to-br from-purple-500/0 to-pink-500/0 group-hover:from-purple-500/10 group-hover:to-pink-500/10 transition-all"></div>
                                    <span class="relative">Clásico</span>
                                </button>
                                <button class="preset-btn group relative overflow-hidden bg-gradient-to-br from-cyan-500/10 to-blue-500/10 hover:from-cyan-500/20 hover:to-blue-500/20 border border-cyan-500/30 rounded-xl p-3 text-xs transition-all duration-300 hover:scale-105" data-preset="wide">
                                    <span class="relative">Abierto</span>
                                </button>
                                <button class="preset-btn group relative overflow-hidden bg-gradient-to-br from-green-500/10 to-emerald-500/10 hover:from-green-500/20 hover:to-emerald-500/20 border border-green-500/30 rounded-xl p-3 text-xs transition-all duration-300 hover:scale-105" data-preset="dense">
                                    <span class="relative">Denso</span>
                                </button>
                                <button class="preset-btn group relative overflow-hidden bg-gradient-to-br from-orange-500/10 to-red-500/10 hover:from-orange-500/20 hover:to-red-500/20 border border-orange-500/30 rounded-xl p-3 text-xs transition-all duration-300 hover:scale-105" data-preset="asymmetric">
                                    <span class="relative">Asimétrico</span>
                                </button>
                                <button class="preset-btn group relative overflow-hidden bg-gradient-to-br from-yellow-500/10 to-amber-500/10 hover:from-yellow-500/20 hover:to-amber-500/20 border border-yellow-500/30 rounded-xl p-3 text-xs transition-all duration-300 hover:scale-105" data-preset="fibonacci">
                                    <span class="relative">Fibonacci</span>
                                </button>
                                <button id="randomBtn" class="group relative overflow-hidden bg-gradient-to-br from-white/10 to-white/5 hover:from-white/20 hover:to-white/10 border border-white/30 rounded-xl p-3 text-xs transition-all duration-300 hover:scale-105">
                                    <span class="relative">✨ Aleatorio</span>
                                </button>
                            </div>
                        </div>

                        <!-- Controles principales -->
                        <div class="backdrop-blur-xl bg-white/5 border border-white/10 rounded-2xl p-5 space-y-5">
                            <h3 class="text-xs uppercase tracking-widest text-cyan-300 mb-3 font-semibold">Parámetros</h3>

                            <div class="space-y-4">
                                <div>
                                    <div class="flex justify-between mb-2">
                                        <label class="text-xs text-white/60">Iteraciones</label>
                                        <span id="depthValue" class="text-xs font-mono text-purple-300">10</span>
                                    </div>
                                    <input type="range" id="depth" min="1" max="20" value="10" class="w-full h-1.5 bg-white/10 rounded-full appearance-none cursor-pointer range-purple">
                                </div>

                                <div>
                                    <div class="flex justify-between mb-2">
                                        <label class="text-xs text-white/60">Longitud Base</label>
                                        <span id="lengthValue" class="text-xs font-mono text-purple-300">120</span>
                                    </div>
                                    <input type="range" id="length" min="60" max="180" value="120" class="w-full h-1.5 bg-white/10 rounded-full appearance-none cursor-pointer range-purple">
                                </div>

                                <div>
                                    <div class="flex justify-between mb-2">
                                        <label class="text-xs text-white/60">Ratio</label>
                                        <span id="reductionValue" class="text-xs font-mono text-purple-300">0.67</span>
                                    </div>
                                    <input type="range" id="reduction" min="0.5" max="0.85" step="0.01" value="0.67" class="w-full h-1.5 bg-white/10 rounded-full appearance-none cursor-pointer range-purple">
                                </div>

                                <div>
                                    <div class="flex justify-between mb-2">
                                        <label class="text-xs text-white/60">Bifurcación</label>
                                        <span id="branchesValue" class="text-xs font-mono text-purple-300">2</span>
                                    </div>
                                    <input type="range" id="branches" min="2" max="8" value="2" class="w-full h-1.5 bg-white/10 rounded-full appearance-none cursor-pointer range-purple">
                                </div>

                                <div>
                                    <div class="flex justify-between mb-2">
                                        <label class="text-xs text-white/60">Ángulo</label>
                                        <span id="angleValue" class="text-xs font-mono text-purple-300">22.5°</span>
                                    </div>
                                    <input type="range" id="angle" min="5" max="90" step="0.5" value="22.5" class="w-full h-1.5 bg-white/10 rounded-full appearance-none cursor-pointer range-purple">
                                </div>
                            </div>
                        </div>

                        <!-- Visuales -->
                        <div class="backdrop-blur-xl bg-white/5 border border-white/10 rounded-2xl p-5">
                            <h3 class="text-xs uppercase tracking-widest text-pink-300 mb-3 font-semibold">Visuales</h3>
                            
                            <div class="space-y-4">
                                <div>
                                    <label class="text-xs text-white/60 mb-2 block">Paleta</label>
                                    <select id="colorScheme" class="w-full bg-white/5 border border-white/20 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-purple-400 transition-colors">
                                        <option value="natural">Natural</option>
                                        <option value="monochrome">Monocromo</option>
                                        <option value="autumn">Otoño</option>
                                        <option value="winter">Invierno</option>
                                        <option value="depth">Por profundidad</option>
                                        <option value="ocean">Océano</option>
                                        <option value="sunset">Atardecer</option>
                                        <option value="neon">Neón</option>
                                        <option value="sakura">Sakura</option>
                                        <option value="fire">Fuego</option>
                                        <option value="ice">Hielo</option>
                                        <option value="pastel">Pastel</option>
                                        <option value="rainbow">Arcoíris</option>
                                        <option value="gold">Dorado</option>
                                        <option value="forest">Bosque</option>
                                    </select>
                                </div>

                                <div>
                                    <label class="text-xs text-white/60 mb-2 block">Fondo</label>
                                    <div class="grid grid-cols-4 gap-2">
                                        <button class="bg-btn h-12 rounded-xl border-2 border-transparent hover:border-white/40 transition-all hover:scale-105" data-bg="dark" style="background-color: #0a0a0a;"></button>
                                        <button class="bg-btn h-12 rounded-xl border-2 border-transparent hover:border-white/40 transition-all hover:scale-105" data-bg="gray" style="background-color: #404040;"></button>
                                        <button class="bg-btn h-12 rounded-xl border-2 border-transparent hover:border-white/40 transition-all hover:scale-105" data-bg="white" style="background-color: #f5f5f5;"></button>
                                        <button class="bg-btn h-12 rounded-xl border-2 border-transparent hover:border-white/40 transition-all hover:scale-105 relative overflow-hidden" data-bg="custom">
                                            <input type="color" id="customBg" value="#f5f5f5" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                                            <div class="pointer-events-none absolute inset-0 flex items-center justify-center text-xl">🎨</div>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Animación -->
                        <div class="backdrop-blur-xl bg-white/5 border border-white/10 rounded-2xl p-5">
                            <h3 class="text-xs uppercase tracking-widest text-emerald-300 mb-3 font-semibold">Animación</h3>
                            
                            <div class="grid grid-cols-2 gap-2 mb-4">
                                <button id="animateBtn" class="bg-gradient-to-r from-emerald-500/20 to-green-500/20 hover:from-emerald-500/30 hover:to-green-500/30 border border-emerald-500/40 text-xs py-2.5 rounded-xl transition-all hover:scale-105">
                                    ▶ Animar
                                </button>
                                <button id="stopAnimBtn" class="bg-white/5 hover:bg-white/10 border border-white/20 text-xs py-2.5 rounded-xl transition-all hover:scale-105">
                                    ⏹ Detener
                                </button>
                            </div>

                            <div>
                                <div class="flex justify-between mb-2">
                                    <label class="text-xs text-white/60">Velocidad</label>
                                    <span id="fpsValue" class="text-xs font-mono text-emerald-300">30 FPS</span>
                                </div>
                                <input type="range" id="fps" min="5" max="60" value="30" class="w-full h-1.5 bg-white/10 rounded-full appearance-none cursor-pointer range-emerald">
                            </div>
                        </div>

                        <!-- Avanzado (accordion) -->
                        <div class="backdrop-blur-xl bg-white/5 border border-white/10 rounded-2xl overflow-hidden">
                            <button id="advancedToggle" class="w-full px-5 py-4 flex items-center justify-between hover:bg-white/5 transition-colors">
                                <h3 class="text-xs uppercase tracking-widest text-orange-300 font-semibold">Avanzado</h3>
                                <svg class="w-4 h-4 transition-transform text-orange-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>

                            <div id="advancedPanel" class="hidden px-5 pb-5 space-y-4">
                                <div>
                                    <label class="text-xs text-white/60 mb-2 block">Tipo de Árbol</label>
                                    <select id="treeType" class="w-full bg-white/5 border border-white/20 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-orange-400 transition-colors">
                                        <option value="binary">Binario (2)</option>
                                        <option value="ternary">Ternario (3)</option>
                                        <option value="quaternary">Cuaternario (4)</option>
                                        <option value="custom">Personalizado</option>
                                    </select>
                                </div>

                                <div id="customBranchesDiv" class="hidden">
                                    <div class="flex justify-between mb-2">
                                        <label class="text-xs text-white/60">Ramas</label>
                                        <span id="branchesValue2" class="text-xs font-mono text-orange-300">2</span>
                                    </div>
                                    <input type="range" id="branches2" min="2" max="8" value="2" class="w-full h-1.5 bg-white/10 rounded-full appearance-none cursor-pointer range-orange">
                                </div>

                                <div>
                                    <div class="flex justify-between mb-2">
                                        <label class="text-xs text-white/60">Asimetría</label>
                                        <span id="asymmetryValue" class="text-xs font-mono text-orange-300">0.0</span>
                                    </div>
                                    <input type="range" id="asymmetry" min="0" max="0.5" step="0.05" value="0" class="w-full h-1.5 bg-white/10 rounded-full appearance-none cursor-pointer range-orange">
                                </div>

                                <div>
                                    <div class="flex justify-between mb-2">
                                        <label class="text-xs text-white/60">Grosor</label>
                                        <span id="thicknessValue" class="text-xs font-mono text-orange-300">6</span>
                                    </div>
                                    <input type="range" id="thickness" min="1" max="12" value="6" class="w-full h-1.5 bg-white/10 rounded-full appearance-none cursor-pointer range-orange">
                                </div>

                                <div>
                                    <div class="flex justify-between mb-2">
                                        <label class="text-xs text-white/60">Ruido</label>
                                        <span id="randomnessValue" class="text-xs font-mono text-orange-300">0%</span>
                                    </div>
                                    <input type="range" id="randomness" min="0" max="25" value="0" class="w-full h-1.5 bg-white/10 rounded-full appearance-none cursor-pointer range-orange">
                                </div>
                            </div>
                        </div>

                        <!-- Acciones -->
                        <div class="space-y-2">
                            <button id="saveBtn" class="w-full bg-gradient-to-r from-purple-500/20 to-pink-500/20 hover:from-purple-500/30 hover:to-pink-500/30 border border-purple-500/40 text-sm py-3 rounded-xl transition-all hover:scale-105">
                                💾 Descargar PNG
                            </button>
                            <button id="resetBtn" class="w-full bg-white/5 hover:bg-white/10 border border-white/20 text-sm py-3 rounded-xl transition-all hover:scale-105">
                                ↻ Restablecer
                            </button>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <style>
        /* Custom scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.3);
        }

        /* Range inputs personalizados */
        input[type="range"] {
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
            transition: all 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.8);
        }
        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }

        .range-emerald::-webkit-slider-thumb {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }
        .range-orange::-webkit-slider-thumb {
            background: linear-gradient(135deg, #f97316, #ea580c);
            box-shadow: 0 0 10px rgba(249, 115, 22, 0.5);
        }

        select option {
            background: #1a1a1a;
            color: white;
        }
    </style>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Configuración del canvas
        function resizeCanvas() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        resizeCanvas();
        window.addEventListener('resize', () => {
            resizeCanvas();
            if (isAnimating) stopAnimation();
            drawTree();
        });

        // Paletas de colores (mismo código)
        const colorSchemes = {
            natural: {
                trunk: (depth, max) => {
                    const ratio = depth / max;
                    if (ratio < 0.3) return '#3d2817';
                    if (ratio < 0.6) return '#5a4a2a';
                    if (ratio < 0.8) return '#4a7c59';
                    return '#2d5a3d';
                },
                leaf: () => '#1a4d2e'
            },
            monochrome: {
                trunk: (depth, max) => {
                    const val = Math.floor(20 + (depth / max) * 180);
                    return `rgb(${val},${val},${val})`;
                },
                leaf: () => '#999'
            },
            autumn: {
                trunk: (depth, max) => {
                    const ratio = depth / max;
                    if (ratio < 0.4) return '#4a2c2a';
                    if (ratio < 0.6) return '#8b5a3c';
                    if (ratio < 0.8) return '#d4a574';
                    return ratio < 0.9 ? '#e8b44f' : '#d64545';
                },
                leaf: () => '#b85450'
            },
            winter: {
                trunk: (depth, max) => {
                    const ratio = depth / max;
                    if (ratio < 0.5) return '#2c3e50';
                    return '#34495e';
                },
                leaf: () => '#5d6d7e'
            },
            depth: {
                trunk: (depth, max) => {
                    const hue = (depth / max) * 200;
                    return `hsl(${hue}, 40%, 35%)`;
                },
                leaf: (depth, max) => {
                    const hue = (depth / max) * 200;
                    return `hsl(${hue}, 50%, 45%)`;
                }
            },
            ocean: {
                trunk: (d, m) => `hsl(${180 + (d/m)*40}, 55%, ${22 + (d/m)*18}%)`,
                leaf:  (d, m) => `hsl(${190 + (d/m)*60}, 70%, ${35 + (d/m)*20}%)`
            },
            sunset: {
                trunk: (d, m) => `hsl(${20 + (d/m)*30}, 60%, ${20 + (d/m)*18}%)`,
                leaf:  (d, m) => `hsl(${10 + (d/m)*80}, 80%, ${40 + (d/m)*12}%)`
            },
            neon: {
                trunk: (d, m) => `hsl(${260 + (d/m)*80}, 90%, 40%)`,
                leaf:  (d, m) => `hsl(${140 + (d/m)*120}, 95%, 55%)`
            },
            sakura: {
                trunk: (d, m) => `hsl(${330}, ${25 + (d/m)*15}%, ${18 + (d/m)*18}%)`,
                leaf:  (d, m) => `hsl(${340 + (d/m)*10}, 80%, ${55 + (d/m)*10}%)`
            },
            fire: {
                trunk: (d, m) => `hsl(${10 + (d/m)*10}, 80%, ${18 + (d/m)*15}%)`,
                leaf:  (d, m) => `hsl(${20 + (d/m)*40}, 95%, ${45 + (d/m)*10}%)`
            },
            ice: {
                trunk: (d, m) => `hsl(${205}, 35%, ${18 + (d/m)*18}%)`,
                leaf:  (d, m) => `hsl(${190 + (d/m)*30}, 70%, ${55 + (d/m)*10}%)`
            },
            pastel: {
                trunk: (d, m) => `hsl(${20 + (d/m)*220}, 35%, 55%)`,
                leaf:  (d, m) => `hsl(${40 + (d/m)*240}, 45%, 70%)`
            },
            rainbow: {
                trunk: (d, m) => `hsl(${(d/m)*300}, 70%, 35%)`,
                leaf:  (d, m) => `hsl(${(d/m)*360}, 85%, 55%)`
            },
            gold: {
                trunk: (d, m) => `hsl(${35}, 55%, ${18 + (d/m)*18}%)`,
                leaf:  (d, m) => `hsl(${45 + (d/m)*10}, 90%, ${45 + (d/m)*8}%)`
            },
            forest: {
                trunk: (d, m) => `hsl(${30}, 35%, ${18 + (d/m)*18}%)`,
                leaf:  (d, m) => `hsl(${95 + (d/m)*25}, 55%, ${30 + (d/m)*18}%)`
            }
        };

        // Estado de la aplicación
        let branchCounter = 0;
        let currentBg = '#f5f5f5';

        // --- Animación ---
        let isAnimating = false;
        let animDepth = 0;
        let animTimer = null;
        let animSeed = 0;
        let animRng = null;

        function mulberry32(seed) {
            return function() {
                let t = seed += 0x6D2B79F5;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        function rand() {
            return (isAnimating && animRng) ? animRng() : Math.random();
        }

        function setAnimStatus(on) {
            const el = document.getElementById('animIndicator');
            if (on) {
                el.classList.remove('hidden');
            } else {
                el.classList.add('hidden');
            }
        }

        function stopAnimation() {
            isAnimating = false;
            setAnimStatus(false);
            animRng = null;
            if (animTimer) {
                clearInterval(animTimer);
                animTimer = null;
            }
        }

        function totalBranches(depth, branches) {
            if (depth <= 0) return 0;
            if (branches === 1) return depth;
            return Math.round((Math.pow(branches, depth) - 1) / (branches - 1));
        }

        function getSettings() {
            return {
                depth: parseInt(document.getElementById('depth').value),
                length: parseInt(document.getElementById('length').value),
                angle: parseFloat(document.getElementById('angle').value),
                reduction: parseFloat(document.getElementById('reduction').value),
                branches: parseInt(document.getElementById('branches').value),
                thickness: parseInt(document.getElementById('thickness').value),
                randomness: parseInt(document.getElementById('randomness').value) / 100,
                asymmetry: parseFloat(document.getElementById('asymmetry').value),
                colorScheme: document.getElementById('colorScheme').value
            };
        }

        // Actualizar valores mostrados
        const inputs = {
            depth: 'depthValue',
            length: 'lengthValue',
            angle: 'angleValue',
            reduction: 'reductionValue',
            branches: 'branchesValue',
            thickness: 'thicknessValue',
            randomness: 'randomnessValue',
            asymmetry: 'asymmetryValue',
            fps: 'fpsValue'
        };

        Object.entries(inputs).forEach(([id, valueId]) => {
            const input = document.getElementById(id);
            if (!input) return;
            input.addEventListener('input', (e) => {
                let value = e.target.value;
                if (id === 'angle') value += '°';
                if (id === 'randomness') value += '%';
                if (id === 'fps') value += ' FPS';
                document.getElementById(valueId).textContent = value;

                if (id === 'branches') syncBranchesTo(parseInt(e.target.value));

                if (isAnimating) stopAnimation();
                drawTree();
            });
        });

        // Control de tipo de árbol
        const treeTypeSelect = document.getElementById('treeType');
        const customBranchesDiv = document.getElementById('customBranchesDiv');
        const branchesInput = document.getElementById('branches');
        const branches2 = document.getElementById('branches2');

        function syncBranchesTo(value) {
            branchesInput.value = value;
            document.getElementById('branchesValue').textContent = value;
            if (branches2) {
                branches2.value = value;
                const b2 = document.getElementById('branchesValue2');
                if (b2) b2.textContent = value;
            }
        }

        if (branches2) {
            branches2.addEventListener('input', (e) => {
                const v = parseInt(e.target.value);
                syncBranchesTo(v);
                if (isAnimating) stopAnimation();
                drawTree();
            });
        }

        treeTypeSelect.addEventListener('change', (e) => {
            const type = e.target.value;

            if (type === 'custom') {
                customBranchesDiv.classList.remove('hidden');
                const v = parseInt(branchesInput.value);
                const b2 = document.getElementById('branchesValue2');
                if (b2) b2.textContent = v;
                if (branches2) branches2.value = v;
            } else {
                customBranchesDiv.classList.add('hidden');

                const branchMap = { binary: 2, ternary: 3, quaternary: 4 };
                syncBranchesTo(branchMap[type]);

                if (isAnimating) stopAnimation();
                drawTree();
            }
        });

        // Función para dibujar rama (MISMO CÓDIGO ORIGINAL)
        function drawBranch(x, y, length, angle, depth, settings, isLeft = null) {
            if (depth === 0 || length < 1) return;

            branchCounter++;

            const noise = settings.randomness * (rand() - 0.5);
            const finalAngle = angle + noise * 30;
            const finalLength = length * (1 + noise * 0.2);

            const rad = finalAngle * Math.PI / 180;
            const x2 = x + finalLength * Math.cos(rad);
            const y2 = y - finalLength * Math.sin(rad);

            const scheme = colorSchemes[settings.colorScheme];
            const ratio = (settings.depth - depth) / settings.depth;
            const color = ratio < 0.7
                ? scheme.trunk(settings.depth - depth, settings.depth)
                : scheme.leaf(settings.depth - depth, settings.depth);

            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = color;
            ctx.lineWidth = Math.max(0.5, settings.thickness * Math.pow(settings.reduction, settings.depth - depth));
            ctx.lineCap = 'round';
            ctx.stroke();

            const nextLength = length * settings.reduction;
            const baseAngle = settings.angle;

            if (settings.branches === 2) {
                const leftAngle = baseAngle * (1 + settings.asymmetry);
                const rightAngle = baseAngle * (1 - settings.asymmetry);

                drawBranch(x2, y2, nextLength, finalAngle + leftAngle, depth - 1, settings, true);
                drawBranch(x2, y2, nextLength, finalAngle - rightAngle, depth - 1, settings, false);

            } else if (settings.branches === 3) {
                drawBranch(x2, y2, nextLength * 0.9, finalAngle + baseAngle, depth - 1, settings);
                drawBranch(x2, y2, nextLength, finalAngle, depth - 1, settings);
                drawBranch(x2, y2, nextLength * 0.9, finalAngle - baseAngle, depth - 1, settings);

            } else if (settings.branches === 4) {
                const angles = [baseAngle * 1.5, baseAngle * 0.5, -baseAngle * 0.5, -baseAngle * 1.5];
                angles.forEach(a => {
                    drawBranch(x2, y2, nextLength * 0.85, finalAngle + a, depth - 1, settings);
                });

            } else if (settings.branches === 5) {
                const angles = [baseAngle * 2, baseAngle, 0, -baseAngle, -baseAngle * 2];
                angles.forEach(a => {
                    drawBranch(x2, y2, nextLength * 0.8, finalAngle + a, depth - 1, settings);
                });

            } else {
                const n = settings.branches;
                const spread = baseAngle * 2.2;
                const step = spread / (n - 1);
                const start = -spread / 2;
                for (let i = 0; i < n; i++) {
                    const a = start + i * step;
                    drawBranch(x2, y2, nextLength * 0.85, finalAngle + a, depth - 1, settings);
                }
            }
        }

        function isLightBackground(color) {
            const hex = color.replace('#', '');
            const r = parseInt(hex.substr(0, 2), 16);
            const g = parseInt(hex.substr(2, 2), 16);
            const b = parseInt(hex.substr(4, 2), 16);
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            return brightness > 128;
        }

        function drawBackground() {
            ctx.fillStyle = currentBg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const isLight = isLightBackground(currentBg);
            const groundGradient = ctx.createLinearGradient(0, canvas.height - 30, 0, canvas.height);
            if (isLight) {
                groundGradient.addColorStop(0, 'rgba(100, 100, 100, 0)');
                groundGradient.addColorStop(1, 'rgba(100, 100, 100, 0.15)');
            } else {
                groundGradient.addColorStop(0, 'rgba(80, 80, 80, 0)');
                groundGradient.addColorStop(1, 'rgba(80, 80, 80, 0.3)');
            }
            ctx.fillStyle = groundGradient;
            ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
        }

        function drawTree() {
            branchCounter = 0;
            const settings = getSettings();

            document.getElementById('totalBranchCount').textContent = totalBranches(settings.depth, settings.branches);

            drawBackground();

            const startX = canvas.width / 2;
            const startY = canvas.height - 10;
            drawBranch(startX, startY, settings.length, 90, settings.depth, settings);

            document.getElementById('branchCount').textContent = branchCounter;
        }

        function drawTreeAnimatedStep() {
            branchCounter = 0;
            const settings = getSettings();

            document.getElementById('totalBranchCount').textContent = totalBranches(settings.depth, settings.branches);

            const visibleDepth = Math.max(1, Math.min(animDepth, settings.depth));

            drawBackground();

            const startX = canvas.width / 2;
            const startY = canvas.height - 10;
            drawBranch(startX, startY, settings.length, 90, visibleDepth, settings);

            document.getElementById('branchCount').textContent = branchCounter;

            if (visibleDepth >= settings.depth) {
                stopAnimation();
            }
        }

        // Presets
        const presets = {
            classic: { depth: 10, angle: 25, reduction: 0.67, branches: 2, asymmetry: 0, randomness: 0, thickness: 6, length: 120 },
            wide: { depth: 10, angle: 35, reduction: 0.7, branches: 2, asymmetry: 0, randomness: 5, thickness: 5, length: 100 },
            dense: { depth: 12, angle: 15, reduction: 0.75, branches: 3, asymmetry: 0, randomness: 0, thickness: 4, length: 110 },
            asymmetric: { depth: 10, angle: 28, reduction: 0.65, branches: 2, asymmetry: 0.3, randomness: 8, thickness: 6, length: 115 },
            fibonacci: { depth: 13, angle: 37.5, reduction: 0.618, branches: 2, asymmetry: 0.38, randomness: 0, thickness: 7, length: 140 }
        };

        function applyPreset(preset) {
            Object.entries(preset).forEach(([key, value]) => {
                const input = document.getElementById(key);
                if (input) {
                    input.value = value;
                    const valueSpan = document.getElementById(key + 'Value');
                    if (valueSpan) {
                        let displayValue = value;
                        if (key === 'angle') displayValue += '°';
                        if (key === 'randomness') displayValue += '%';
                        valueSpan.textContent = displayValue;
                    }
                }
            });
            syncBranchesTo(parseInt(document.getElementById('branches').value));
            drawTree();
        }

        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                stopAnimation();
                const preset = presets[btn.dataset.preset];
                applyPreset(preset);
            });
        });

        document.getElementById('randomBtn').addEventListener('click', () => {
            stopAnimation();

            const random = {
                depth: Math.floor(Math.random() * 6) + 9,
                angle: Math.floor(Math.random() * 40) + 15,
                reduction: (Math.random() * 0.25 + 0.55).toFixed(2),
                branches: Math.floor(Math.random() * 7) + 2,
                asymmetry: (Math.random() * 0.4).toFixed(2),
                randomness: Math.floor(Math.random() * 15),
                thickness: Math.floor(Math.random() * 6) + 4,
                length: Math.floor(Math.random() * 60) + 90
            };

            Object.entries(random).forEach(([key, value]) => {
                const input = document.getElementById(key);
                if (input) {
                    input.value = value;
                    input.dispatchEvent(new Event('input'));
                }
            });

            const schemes = Object.keys(colorSchemes);
            document.getElementById('colorScheme').value = schemes[Math.floor(Math.random() * schemes.length)];

            syncBranchesTo(parseInt(document.getElementById('branches').value));
            drawTree();
        });

        document.getElementById('advancedToggle').addEventListener('click', () => {
            const panel = document.getElementById('advancedPanel');
            const icon = document.querySelector('#advancedToggle svg');
            panel.classList.toggle('hidden');
            icon.style.transform = panel.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
        });

        document.getElementById('saveBtn').addEventListener('click', () => {
            stopAnimation();
            const link = document.createElement('a');
            const timestamp = new Date().toISOString().slice(0, 19).replace(/:/g, '-');
            link.download = `arbofractal-${timestamp}.png`;
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            stopAnimation();
            applyPreset(presets.classic);
            document.getElementById('colorScheme').value = 'natural';
            currentBg = '#f5f5f5';
            document.getElementById('customBg').value = '#f5f5f5';
            updateBgButtons();
            drawTree();
        });

        const bgButtons = document.querySelectorAll('.bg-btn');
        const customBgInput = document.getElementById('customBg');

        function updateBgButtons() {
            bgButtons.forEach(btn => {
                btn.style.borderColor = 'transparent';
            });

            const activeBtn = Array.from(bgButtons).find(btn => {
                if (btn.dataset.bg === 'custom') return false;
                const color = getComputedStyle(btn).backgroundColor;
                return rgbToHex(color) === currentBg;
            });

            if (activeBtn) {
                activeBtn.style.borderColor = 'rgba(255,255,255,0.6)';
            } else {
                bgButtons[bgButtons.length - 1].style.borderColor = 'rgba(255,255,255,0.6)';
            }
        }

        function rgbToHex(rgb) {
            const values = rgb.match(/\d+/g);
            if (!values) return rgb;
            const hex = values.map(x => {
                const hx = parseInt(x).toString(16);
                return hx.length === 1 ? '0' + hx : hx;
            }).join('');
            return '#' + hex;
        }

        bgButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                stopAnimation();
                if (btn.dataset.bg === 'custom') {
                    customBgInput.click();
                    return;
                }

                const bgMap = { dark: '#0a0a0a', gray: '#404040', white: '#f5f5f5' };
                currentBg = bgMap[btn.dataset.bg];
                updateBgButtons();
                drawTree();
            });
        });

        customBgInput.addEventListener('input', (e) => {
            stopAnimation();
            currentBg = e.target.value;
            updateBgButtons();
            drawTree();
        });

        updateBgButtons();

        document.getElementById('animateBtn').addEventListener('click', () => {
            stopAnimation();
            isAnimating = true;
            setAnimStatus(true);

            animSeed = Date.now() >>> 0;
            animRng = mulberry32(animSeed);

            animDepth = 1;

            const fps = parseInt(document.getElementById('fps').value);
            const interval = Math.max(16, Math.floor(1000 / fps));

            drawTreeAnimatedStep();

            animTimer = setInterval(() => {
                if (!isAnimating) return;
                animDepth += 1;
                drawTreeAnimatedStep();
            }, interval);
        });

        document.getElementById('stopAnimBtn').addEventListener('click', () => {
            stopAnimation();
            drawTree();
        });

        // Inicialización
        syncBranchesTo(parseInt(branchesInput.value));
        customBgInput.value = currentBg;
        updateBgButtons();
        drawTree();
    </script>
</body>
</html>
